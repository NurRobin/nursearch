name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    # Arch, the platform NurSearch is packaged for: Ubuntu LTS images lack
    # gtk4-layer-shell.
    container: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm --needed git rust gtk4 gtk4-layer-shell sqlite pkgconf

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
